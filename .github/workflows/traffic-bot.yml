name: TraffiKing Main Account

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:
  
jobs:
  traffic-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # ← CHANGED FROM 20
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Run TraffiKing Bot
        env:
          BLOG_URL: 'https://allai-info.blogspot.com'
          ACCOUNT_NAME: 'MAIN'
          SESSIONS: '10'
          PAGES_PER_SESSION: '3'
          MIN_READ_TIME: '20'
          MAX_READ_TIME: '45'
          AD_CLICK_CHANCE: '35'
        run: |
          echo "🚀 Starting TraffiKing - Main Account"
          node .github/scripts/traffic-bot.js
      
      - name: Summary
        if: always()
        run: echo "✅ Main account session completed"
